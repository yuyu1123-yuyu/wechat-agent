webui:
  enabled: true
  host: 127.0.0.1
  port: 8640
  max_log_lines: 600
wechat:
  master_chat: 你的大号昵称
  self_nick: 机器人昵称
  group_chats: []
  self_nick_aliases: []
  ignore_self: true
  bot_account: ''
llm:
  dsh_profile: ${DSH_PROFILE:headless}
  dsh_node: ${DSH_NODE:node}
  dsh_bin: ${DSH_BIN:}
  work_dir: ${DSH_WORK_DIR:./agent-workspace}
  api_key_file: config/local-credentials.yaml
  api_key_field: DEEPSEEK_API_KEY
  api_url: https://api.deepseek.com/chat/completions
  api_model: ${DEEPSEEK_MODEL:deepseek-flash}
  group_default: api
  harness_concurrency: 2
  dsh_timeout: 240
  api_timeout: 180
  max_task_chars: 20000
  api_retries: 2
skills:
  basic:
  - wechat-natural-chat
  on_demand:
    wechat-schedule:
    - 日程
    - 安排
    - 提醒
    - 几点
    - 什么时候
    - 什么时间
    - 计划
    - 规划
    - 待办
    - 备忘
    - 聚会
    - 吃饭
    - 考试
    - 开会
    - 出发
    weather-zh:
    - 天气
    - 气温
    - 温度
    - 多少度
    - 下雨
    - 下雪
    - 降温
    - 升温
    - 带伞
    - 风力
    - 风大
    - 晴
    - 阴
    - 冷
    - 热
  max_skill_chars: 800
behavior:
  mention_context_count: 10
  ack_message: 收到！正在处理中，稍等一下～
  max_history_msgs: 20
  max_history_chars: 8000
  group_history_limit: 10
  group_history_chars: 3000
  group_context_limit: 50
  max_reply_chars: 1500
  group_summary_every: 15
  group_active_speak: false
  group_active_cooldown: 900
  group_active_cold_msg: 8
  group_active_context: 15
  max_input_chars: 3000
  catchup_window_minutes: 60
  memory_max_lines: 50
  schedule_keep_hours: 24
  mention_window_sec: 90
  send_retry: 1
  interactive_failover: false
  sender_queue_max: 50
  web_search_guide_enabled: true
  web_search_guide: "【联网搜索】\n- 当问题涉及实时/最新信息（新闻、天气、汇率、股价、热搜、活动、某网站现状），\n  或需要确认某个不确定的事实、数据、价格、事件时，请【主动】使用联网搜索工具查询，\n\
    \  再基于真实结果回答，不要凭印象编造。\n- 搜索关键词要精简（3-6 个字），一次没搜到就换关键词再搜，直到找到可靠信息。\n- 如果对方明确表示不需要联网（如闲聊、回忆、纯推理），则不需要搜索。\n\
    - 拿不准要不要搜时，倾向于搜。\n"
  group_help_text: '我能做什么，简单说：

    1 聊天陪伴：接话、共情、活跃气氛，像真人朋友

    2 问答百科：知识类问题直接问我

    3 天气查询：说「今天天气怎么样」就行

    4 日程备忘：说「记住：周五3点考试」，我帮你记着

    5 联网搜索：新闻、价格、热搜这类实时信息我会去查

    6 长期记忆：重要的事我会一直记住


    怎么用我：

    - 在群里 @我 加要说的话，我就会回

    - 需要我处理复杂任务时，消息里带上【harness】

    - 发 list 可以随时看这份说明

    - 有重要的事想让我记住，直接说「记住：xxx」

    '
  unreadable_notice: 刚才那条消息微信那边加密/压缩了，我这边读不出内容。麻烦缩短一点（50字以内）重新发一下，或拆成几条发～
  list_help_text: '我是你的微信助手（小号 qianhua 在替你打理消息）。我能做什么：


    【功能】

    · 聊天陪伴：接话、共情、答疑

    · 天气查询：说「今天天气怎么样」/「安阳几度」

    · 日程备忘：说「记住：周五3点考试」，到点我主动提醒你

    · 联网搜索：新闻、价格、热搜等实时信息我会去查

    · 长期记忆：重要的事我会一直记住，跨聊天都认

    · 私聊全权限：我可以操作电脑上的文件、跑命令、联网（harness 模式）


    【特殊指令】（私聊里直接发）

    #记住 内容        —— 让你永久记住某事（如 #记住 我喜欢喝奶茶）

    #查看记忆        —— 看看我记住了什么

    #清空长期记忆    —— 清空我的长期记忆

    #清空记忆        —— 清空我们的对话历史

    #规则 内容       —— 给我加一条必须遵守的规则

    #查看规则 / #清空规则 —— 查看/清空规则

    mask / mask 女友 —— 查看/切换我的人格面具

    【直连】或【api】 —— 切到快速模式（秒回，但无电脑权限）

    【harness】      —— 切到全权限模式（可操作电脑，稍慢）


    【群里怎么用我】

    · 在群里 @qianhua 再加要说的话，我就会回

    · 群聊默认 @ 才回、回复简短；需要我处理复杂任务就在消息里带【harness】

    · 发「list」随时看这份说明


    试试看：直接告诉我你想做什么就行。

    '
