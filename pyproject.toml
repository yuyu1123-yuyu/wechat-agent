[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-agent"
version = "3.0.0"
description = "微信 ↔ DeepSeek Harness 桥接机器人 v3（domain/ports/infra/app 分层）"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "wechatauto-replica>=1.2.8.1",
    "Pillow>=10",
    "pywin32>=306; sys_platform == 'win32'",
    "uiautomation>=2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
